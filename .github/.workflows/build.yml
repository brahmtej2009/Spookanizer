name: Build
on:
  push:
    branches: ["**"]   # every push to any branch
    tags: ["v*"]       # pushing a version tag like v1.0 also makes a release
  workflow_dispatch:   # adds a "Run workflow" button on the Actions page

permissions:
  contents: write      # needed only to attach files to a release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name spookanizer-${{ matrix.name }} main.py

      - name: Put .env next to the executable
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "The ENV_FILE secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > dist/.env

      - name: Zip executable and .env together
        shell: bash
        run: |
          cd dist
          shopt -s dotglob
          python -m zipfile -c ../spookanizer-${{ matrix.name }}.zip *

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: spookanizer-${{ matrix.name }}
          path: dist/
          include-hidden-files: true   # without this, files starting with a dot (.env) are skipped

      - name: Attach to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: spookanizer-${{ matrix.name }}.zip